<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Item - BlockForgeMods</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">BlockForgeMods</a>
    </header>

    <div class="container">
        <div id="view-content" style="max-width: 900px; margin: 0 auto;">
            <div style="display: flex; gap: 30px; flex-wrap: wrap; margin-top: 30px;">
                <img id="main-img" style="width: 100%; max-width: 350px; border-radius: 15px; border: 1px solid #333;">
                <div style="flex: 1; min-width: 300px;">
                    <h1 id="item-name" style="color: var(--accent); font-size: 2.5rem;">Loading...</h1>
                    <p id="item-author" style="color: #888; font-size: 1.1rem; margin-bottom: 20px;"></p>
                    <div style="display: flex; gap: 10px;">
                        <a id="dl-btn" class="btn" target="_blank">Download Now</a>
                        <button id="share-btn" class="btn" style="background: #222; color: white;">Share</button>
                    </div>
                </div>
            </div>

            <div style="margin-top: 50px;">
                <h3 style="border-bottom: 2px solid var(--accent); display: inline-block; padding-bottom: 5px;">Description</h3>
                <p id="item-desc" style="margin-top: 15px; white-space: pre-line; color: #ccc; line-height: 1.8;"></p>
            </div>

            <div style="margin-top: 50px;">
                <h3>Screenshots</h3>
                <div id="screenshots-gallery" style="display: flex; gap: 15px; overflow-x: auto; padding: 10px 0;">
                    <!-- Screenshots will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/view.js"></script>
</body>
</html>
