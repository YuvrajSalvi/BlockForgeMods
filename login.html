<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlockForgeMods</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">
    <div style="background: var(--card-bg); padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; border: 1px solid #333;">
        <h2 style="color: var(--accent); text-align: center; margin-bottom: 20px;">Admin Login</h2>
        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e11; border: 1px solid #444; color: white; border-radius: 8px;">
            <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0e11; border: 1px solid #444; color: white; border-radius: 8px;">
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
